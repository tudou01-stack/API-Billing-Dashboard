<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>API 余额台</title>
  <style>
    :root {
      --canvas:#f2f4f3; --surface:#fff; --ink:#17201d; --muted:#66706c;
      --border:#dde2df; --primary:#b8ea63; --positive:#1e8a5a;
      --warning:#b56a16; --danger:#c54343; --info:#376dce;
      --radius-control:10px; --radius-panel:18px; --shadow:0 10px 30px rgba(23,32,29,.06);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink); background:var(--canvas); font-synthesis:none;
    }
    *{box-sizing:border-box} body{margin:0;background:var(--canvas);color:var(--ink)}
    button,input,select,textarea{font:inherit} button{min-height:44px}
    .safety-banner{min-height:34px;background:var(--ink);color:#fff;padding:7px 24px;font-size:13px}
    .app-shell{display:grid;grid-template-columns:224px 1fr;min-height:calc(100vh - 34px)}
    .sidebar{background:#fff;border-right:1px solid var(--border);padding:28px 24px}
    .brand{font-size:18px;font-weight:750}.nav-list{display:grid;gap:8px;margin-top:32px}
    .nav-button{border:0;background:transparent;text-align:left;border-radius:10px;padding:0 14px;color:var(--muted);font-size:13px;font-weight:650}
    .nav-button[aria-current="page"]{background:#eef7df;color:var(--ink)}
    .workspace{padding:36px 40px}.workspace h1{margin:0;font-size:28px;letter-spacing:-.03em}
    .view[hidden]{display:none}
    @media(max-width:900px){.app-shell{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--border)}.nav-list{grid-template-columns:repeat(4,1fr);margin-top:20px}.workspace{padding:28px 20px}}
    @media(max-width:620px){.safety-banner{padding-inline:16px}.workspace{padding:24px 16px}.nav-button{padding-inline:8px;font-size:12px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.001ms!important;animation-duration:.001ms!important}}
  </style>
</head>
<body>
  <div class="safety-banner" role="note">所有密钥与数据仅保存在当前浏览器中。请定期导出备份。</div>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">API 余额台</div>
      <nav class="nav-list">
        <button class="nav-button" type="button" data-view="overview" aria-current="page">总览</button>
        <button class="nav-button" type="button" data-view="analytics">流水与趋势</button>
        <button class="nav-button" type="button" data-view="logs">日志</button>
        <button class="nav-button" type="button" data-view="settings">设置</button>
      </nav>
    </aside>
    <main class="workspace">
      <section class="view" id="view-overview"><h1>渠道总览</h1><div id="overview-content"></div></section>
      <section class="view" id="view-analytics" hidden><h1>流水与趋势</h1></section>
      <section class="view" id="view-logs" hidden><h1>日志</h1></section>
      <section class="view" id="view-settings" hidden><h1>设置</h1></section>
    </main>
  </div>
  <div id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script id="app-script">
    'use strict';
    const STORAGE_KEY = 'api_dashboard_v1';
    const DEFAULT_STATE = Object.freeze({
      version: 1,
      settings: Object.freeze({
        lowBalanceThreshold: 10,
        dailySpendAlertThreshold: 20,
        autoRefreshEnabled: false,
        autoRefreshIntervalMinutes: 30,
        defaultCurrency: 'USD',
        cnyPerUsd: 7.2
      }),
      channels: Object.freeze([]),
      balanceSnapshots: Object.freeze([]),
      spendingRecords: Object.freeze([]),
      logs: Object.freeze([])
    });

    function clone(value) {
      return typeof structuredClone === 'function'
        ? structuredClone(value)
        : JSON.parse(JSON.stringify(value));
    }

    function createDefaultState() {
      return clone(DEFAULT_STATE);
    }

    function safeNumber(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function normalizeState(input) {
      const base = createDefaultState();
      const source = input && typeof input === 'object' ? input : {};
      const sourceSettings = source.settings && typeof source.settings === 'object' ? source.settings : {};
      const interval = Math.max(5, safeNumber(sourceSettings.autoRefreshIntervalMinutes) ?? 30);
      return {
        ...base,
        ...source,
        version: 1,
        settings: { ...base.settings, ...sourceSettings, autoRefreshIntervalMinutes: interval },
        channels: Array.isArray(source.channels) ? source.channels : [],
        balanceSnapshots: Array.isArray(source.balanceSnapshots) ? source.balanceSnapshots : [],
        spendingRecords: Array.isArray(source.spendingRecords) ? source.spendingRecords : [],
        logs: Array.isArray(source.logs) ? source.logs : []
      };
    }

    class DashboardError extends Error {
      constructor(kind, message, details = {}) {
        super(message);
        this.name = 'DashboardError';
        this.kind = kind;
        this.httpStatus = details.httpStatus ?? 0;
        this.cause = details.cause;
      }
    }

    function resolveJsonPath(data, path) {
      if (!path || typeof path !== 'string') return undefined;
      const parts = path.replace(/\[(\d+)\]/g, '.$1').split('.').filter(Boolean);
      const forbidden = new Set(['__proto__', 'prototype', 'constructor']);
      let current = data;
      for (const part of parts) {
        if (forbidden.has(part) || current == null || !Object.prototype.hasOwnProperty.call(Object(current), part)) {
          return undefined;
        }
        current = current[part];
      }
      return current;
    }

    function requireHttpUrl(value, label) {
      let url;
      try { url = new URL(String(value || '')); }
      catch { throw new DashboardError('config', `${label}不是有效网址`); }
      if (!['http:', 'https:'].includes(url.protocol)) {
        throw new DashboardError('config', `${label}仅支持 HTTP 或 HTTPS`);
      }
      return url;
    }

    function buildRequest(channel) {
      let target;
      if (channel.platformType === 'deepseek') {
        target = 'https://api.deepseek.com/user/balance';
      } else if (channel.platformType === 'oneapi') {
        const root = requireHttpUrl(channel.endpoint, '站点地址');
        root.pathname = root.pathname.replace(/\/+$/, '') + '/api/user/self';
        root.search = '';
        root.hash = '';
        target = root.toString();
      } else {
        target = requireHttpUrl(channel.endpoint, '接口地址').toString();
      }
      const headers = { Accept: 'application/json', Authorization: `Bearer ${channel.apiKey || ''}` };
      if (channel.platformType === 'oneapi' && String(channel.newApiUserId || '').trim()) {
        headers['New-Api-User'] = String(channel.newApiUserId).trim();
      }
      let url = target;
      if (channel.corsMode && channel.corsMode !== 'direct') {
        const proxy = requireHttpUrl(channel.proxyUrl, '代理地址').toString();
        url = proxy.includes('{url}')
          ? proxy.replace('{url}', encodeURIComponent(target))
          : `${proxy}${proxy.includes('?') ? '&' : '?'}url=${encodeURIComponent(target)}`;
      }
      return { url, targetUrl: target, options: { method: 'GET', headers } };
    }

    function parsePlatformBalance(channel, payload) {
      if (!payload || typeof payload !== 'object') {
        throw new DashboardError('parse', '接口没有返回可识别的 JSON 数据');
      }
      if (channel.platformType === 'deepseek') {
        const entries = Array.isArray(payload.balance_infos) ? payload.balance_infos : [];
        const parsed = entries.map(item => ({
          currency: String(item?.currency || '').toUpperCase(),
          balance: safeNumber(item?.total_balance)
        })).filter(item => item.currency && item.balance !== null);
        if (!parsed.length) throw new DashboardError('parse', '无法从 DeepSeek 返回数据中解析余额');
        const selected = parsed.find(item => item.currency === 'USD') || parsed[0];
        return {
          balance: selected.balance,
          currency: selected.currency,
          isAvailable: payload.is_available !== false,
          additionalBalances: parsed.filter(item => item !== selected)
        };
      }
      if (channel.platformType === 'oneapi') {
        if (payload.success === false) {
          throw new DashboardError('api', String(payload.message || '渠道返回失败状态'));
        }
        const quota = safeNumber(payload.data?.quota);
        const ratio = safeNumber(channel.quotaPerUsd) ?? 500000;
        if (quota === null || ratio <= 0) throw new DashboardError('parse', '无法从 OneAPI 返回数据中解析额度');
        return { balance: quota / ratio, currency: 'USD', isAvailable: true, additionalBalances: [] };
      }
      const value = safeNumber(resolveJsonPath(payload, channel.customJsonPath));
      if (value === null) throw new DashboardError('parse', '无法从返回数据中解析余额，请检查取值路径');
      return {
        balance: value,
        currency: String(channel.customCurrency || 'USD').toUpperCase(),
        isAvailable: true,
        additionalBalances: []
      };
    }

    async function fetchChannel(channel, fetchImpl = fetch, timeoutMs = 10000) {
      const request = buildRequest(channel);
      const controller = new AbortController();
      let timedOut = false;
      const timer = setTimeout(() => { timedOut = true; controller.abort(); }, timeoutMs);
      try {
        const response = await fetchImpl(request.url, { ...request.options, signal: controller.signal });
        const text = await response.text();
        let payload = null;
        if (text) {
          try { payload = JSON.parse(text); }
          catch { throw new DashboardError('parse', '接口返回的内容不是合法 JSON'); }
        }
        const ok = typeof response.ok === 'boolean'
          ? response.ok
          : response.status >= 200 && response.status < 300;
        if (!ok) {
          throw new DashboardError('http', payload?.message || `接口错误：${response.status}`, { httpStatus: response.status });
        }
        return { ...parsePlatformBalance(channel, payload), httpStatus: response.status, requestUrl: request.targetUrl };
      } catch (error) {
        if (error instanceof DashboardError) throw error;
        if (timedOut || error?.name === 'AbortError') {
          throw new DashboardError('network', '请求超时，请检查网络或代理设置', { cause: error });
        }
        throw new DashboardError('network', '网络异常或跨域请求被拦截，请检查代理设置', { cause: error });
      } finally {
        clearTimeout(timer);
      }
    }

    async function runPool(items, worker, concurrency = 3) {
      const source = Array.from(items);
      const results = new Array(source.length);
      let cursor = 0;
      async function runner() {
        while (cursor < source.length) {
          const index = cursor++;
          try { results[index] = { status: 'fulfilled', value: await worker(source[index], index) }; }
          catch (error) { results[index] = { status: 'rejected', reason: error }; }
        }
      }
      await Promise.all(Array.from({ length: Math.min(Math.max(1, concurrency), source.length) }, runner));
      return results;
    }

    function makeId() {
      return globalThis.crypto?.randomUUID?.() || `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
    }

    function redactSecrets(value, secrets = []) {
      let text = String(value ?? '');
      for (const secret of secrets.filter(Boolean)) {
        const escaped = String(secret).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        text = text.replace(new RegExp(escaped, 'g'), '••••');
      }
      return text
        .replace(/Bearer\s+[A-Za-z0-9._~+\/-]+/gi, 'Bearer ••••')
        .replace(/sk-[A-Za-z0-9_-]{4,}/gi, 'sk-••••');
    }

    function sanitizeLogValue(value, secrets) {
      if (typeof value === 'string') return redactSecrets(value, secrets);
      if (Array.isArray(value)) return value.map(item => sanitizeLogValue(item, secrets));
      if (value && typeof value === 'object') {
        return Object.fromEntries(Object.entries(value).map(([key, item]) => [key, sanitizeLogValue(item, secrets)]));
      }
      return value;
    }

    function appendLog(state, entry, secrets = []) {
      state.logs.push({
        id: entry.id || makeId(),
        timestamp: entry.timestamp ?? Date.now(),
        level: ['info', 'warn', 'error'].includes(entry.level) ? entry.level : 'info',
        category: entry.category || 'settings_change',
        channelId: entry.channelId || '',
        message: redactSecrets(entry.message || '', secrets),
        detail: sanitizeLogValue(entry.detail || {}, secrets)
      });
      if (state.logs.length > 1000) state.logs.splice(0, state.logs.length - 1000);
      return state.logs[state.logs.length - 1];
    }

    function roundAmount(value) {
      return Math.round((value + Number.EPSILON) * 1e12) / 1e12;
    }

    function recordSuccessfulBalance(state, channel, result, now = Date.now()) {
      const balance = safeNumber(result.balance);
      const currency = String(result.currency || '').toUpperCase();
      if (balance === null || !currency) throw new DashboardError('parse', '余额不是有效数值');
      const previous = state.balanceSnapshots
        .filter(item => item.channelId === channel.id && item.currency === currency)
        .sort((a, b) => b.timestamp - a.timestamp)[0];
      const snapshot = { channelId: channel.id, timestamp: now, balance, currency };
      state.balanceSnapshots.push(snapshot);
      const channelIndexes = state.balanceSnapshots
        .map((item, index) => item.channelId === channel.id ? index : -1)
        .filter(index => index >= 0);
      if (channelIndexes.length > 200) {
        const remove = new Set(channelIndexes.slice(0, channelIndexes.length - 200));
        state.balanceSnapshots = state.balanceSnapshots.filter((_, index) => !remove.has(index));
      }
      channel.lastBalance = balance;
      channel.lastCurrency = currency;
      channel.lastRefreshAt = now;
      channel.lastAvailability = result.isAvailable !== false;
      channel.lastAdditionalBalances = Array.isArray(result.additionalBalances) ? clone(result.additionalBalances) : [];
      channel.status = result.isAvailable === false ? 'error' : 'ok';
      channel.lastError = result.isAvailable === false ? '当前不可用于调用' : '';
      channel.consecutiveFailCount = 0;
      channel.updatedAt = now;
      if (!previous) return { snapshot, record: null };
      const difference = roundAmount(previous.balance - balance);
      if (difference === 0) return { snapshot, record: null };
      const record = {
        id: makeId(), channelId: channel.id,
        type: difference > 0 ? 'auto_diff' : 'manual_recharge',
        amount: Math.abs(difference), currency, timestamp: now,
        note: difference > 0 ? '根据相邻成功余额自动估算' : '余额增加，自动识别为充值或赠金'
      };
      state.spendingRecords.push(record);
      return { snapshot, record };
    }

    function convertCurrency(amount, from, to, cnyPerUsd) {
      const value = safeNumber(amount);
      const rate = safeNumber(cnyPerUsd);
      const source = String(from || '').toUpperCase();
      const target = String(to || '').toUpperCase();
      if (value === null || !['USD', 'CNY'].includes(source) || !['USD', 'CNY'].includes(target)) return null;
      if (source === target) return value;
      if (rate === null || rate <= 0) return null;
      return source === 'USD' ? value * rate : value / rate;
    }

    function sameLocalDay(left, right) {
      return left.getFullYear() === right.getFullYear()
        && left.getMonth() === right.getMonth()
        && left.getDate() === right.getDate();
    }

    function summarize(state, now = Date.now()) {
      const target = state.settings.defaultCurrency;
      const rate = state.settings.cnyPerUsd;
      const current = new Date(now);
      const summary = { totalBalance: 0, totalSpend: 0, todaySpend: 0, monthSpend: 0, unknownCurrencies: [] };
      const unknown = new Set();
      for (const channel of state.channels) {
        if (safeNumber(channel.lastBalance) === null || !channel.lastCurrency) continue;
        const converted = convertCurrency(channel.lastBalance, channel.lastCurrency, target, rate);
        if (converted === null) unknown.add(channel.lastCurrency);
        else summary.totalBalance += converted;
      }
      for (const record of state.spendingRecords) {
        if (!['auto_diff', 'manual_adjust'].includes(record.type)) continue;
        const converted = convertCurrency(record.amount, record.currency, target, rate);
        if (converted === null) { unknown.add(record.currency); continue; }
        const time = new Date(record.timestamp);
        summary.totalSpend += converted;
        if (time.getFullYear() === current.getFullYear() && time.getMonth() === current.getMonth()) {
          summary.monthSpend += converted;
        }
        if (sameLocalDay(time, current)) summary.todaySpend += converted;
      }
      summary.unknownCurrencies = Array.from(unknown);
      for (const key of ['totalBalance', 'totalSpend', 'todaySpend', 'monthSpend']) summary[key] = roundAmount(summary[key]);
      return summary;
    }

    function validateImport(input) {
      if (!input || typeof input !== 'object') throw new DashboardError('import', '备份内容不是有效对象');
      if (input.version !== 1) throw new DashboardError('import', '备份版本不受支持');
      for (const key of ['channels', 'balanceSnapshots', 'spendingRecords', 'logs']) {
        if (input[key] !== undefined && !Array.isArray(input[key])) throw new DashboardError('import', `备份字段 ${key} 格式错误`);
      }
      return normalizeState(clone(input));
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? validateImport(JSON.parse(raw)) : createDefaultState();
      } catch { return createDefaultState(); }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    globalThis.__API_DASHBOARD_TEST__ = {
      createDefaultState, normalizeState, safeNumber, resolveJsonPath,
      buildRequest, parsePlatformBalance, fetchChannel, runPool, DashboardError,
      redactSecrets, appendLog, recordSuccessfulBalance, convertCurrency,
      summarize, validateImport, loadState, saveState
    };
  </script>
</body>
</html>
